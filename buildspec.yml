# AWS CodeBuild: build the API image (backend/Dockerfile) and push it to ECR.
version: 0.2
env:
  variables:
    REPOSITORY: 543175219403.dkr.ecr.ap-south-1.amazonaws.com/healthfolio-api
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin "${REPOSITORY%%/*}"
      - TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-7)
  build:
    commands:
      - docker build -t "$REPOSITORY:$TAG" -t "$REPOSITORY:latest" backend
  post_build:
    commands:
      - docker push "$REPOSITORY:$TAG"
      - docker push "$REPOSITORY:latest"
      - echo "pushed $REPOSITORY:$TAG"
