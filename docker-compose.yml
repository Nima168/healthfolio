# Local development only. Do not use these defaults in any deployed environment.
services:
  db:
    image: postgres:16
    container_name: healthcare-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthcare_dev_password}
      POSTGRES_DB: healthcare_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d healthcare_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
