# Render blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Secrets are never stored here: GROQ_API_KEY is entered in the Render dashboard.
databases:
  - name: healthfolio-db
    plan: free
    databaseName: healthfolio
    user: healthfolio

services:
  - type: web
    name: healthfolio-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: healthfolio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # The site calls the API through its own /api path (rewrite below), so cookies stay first-party.
      - key: CORS_ORIGINS
        value: https://healthfolio.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://healthfolio.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: EMAIL_BACKEND
        value: disabled
      - key: EXTRACTION_ENABLED
        value: "true"
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: healthfolio
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: /api/v1
    routes:
      - type: rewrite
        source: /api/*
        destination: https://healthfolio-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
