[project]
name = "healthcare-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.0",
    "fpdf2>=2.8.9",
    "groq>=1.7.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymupdf>=1.28.2",
    "pypdf>=6.20.0",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # backend/alembic/ is migrations, not the package

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fake credentials are intentional in redaction tests
"alembic/versions/**" = ["E501"]  # generated SQL constraint strings

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the real PostgreSQL test database (docker compose up)",
    "live: calls the real Groq API (opt-in with RUN_LIVE_AI=1; uses your quota)",
]
