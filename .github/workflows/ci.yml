# Continuous integration: every pull request and every push (except to main, where deploy.yml runs it first).
# No AI calls (the backend tests use a fake Groq client) and no AWS access.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway test database inside the CI job; the same defaults as docker-compose.yml (not secrets).
          POSTGRES_USER: healthcare
          POSTGRES_PASSWORD: healthcare_dev_password
          POSTGRES_DB: healthcare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U healthcare -d healthcare_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://healthcare:healthcare_dev_password@localhost:5432/healthcare_test
    steps:
      - uses: actions/checkout@v5
      - name: Install Tesseract OCR (scanned-copy tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests (unit and integration)
        run: uv run pytest -q

  frontend:
    name: Frontend (oxlint, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
